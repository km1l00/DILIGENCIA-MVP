<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Due Diligence · Portal</title>
  <style>
    :root { --gold: #EABC1F; --gold-light: #F0CB45; --navy-deep: #1D3A45; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      background: linear-gradient(180deg, #6ca7c4 0%, #3b7a94 55%, #1D3A45 100%);
    }

    /* Video de fondo */
    .bg-video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scale(1.05);
      filter: saturate(1.1) contrast(1.05);
    }
    .overlay-1 { position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(255,255,255,0.20), transparent, rgba(255,255,255,0.10)); }
    .overlay-2 { position: absolute; inset: 0; background: rgba(255,255,255,0.05); mix-blend-mode: overlay; }

    /* Panel liquid glass */
    .panel-wrap { position: relative; z-index: 10; width: 100%; max-width: 28rem; padding: 0 1rem;
      animation: rise 0.6s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .panel {
      background: rgba(255, 255, 255, 0.18);
      -webkit-backdrop-filter: blur(40px) saturate(200%) brightness(1.1);
      backdrop-filter: blur(40px) saturate(200%) brightness(1.1);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 8px 32px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.5), inset 0 -1px 0 rgba(255,255,255,0.1);
    }

    .header { padding: 2rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.2); }
    .logo-badge {
      margin: 0 auto 1rem; height: 4rem; width: 4rem;
      display: flex; align-items: center; justify-content: center;
      border-radius: 20px;
      background: rgba(234, 188, 31, 0.25);
      border: 1px solid rgba(234, 188, 31, 0.4);
      backdrop-filter: blur(10px);
      animation: pop 0.5s ease 0.2s both;
    }
    @keyframes pop { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    .logo-badge svg { height: 2rem; width: 2rem; color: var(--gold); }
    .brand { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.02em; color: var(--gold); text-shadow: 0 1px 2px rgba(0,0,0,0.15); }
    .tagline { margin-top: 0.5rem; font-size: 0.875rem; color: rgba(255,255,255,0.8); }

    form { padding: 2rem; display: flex; flex-direction: column; gap: 1.25rem; }
    .field { display: flex; flex-direction: column; gap: 0.5rem; }
    label { font-size: 0.875rem; font-weight: 500; color: rgba(255,255,255,0.9); }
    .input-wrap { position: relative; }
    input {
      width: 100%; height: 44px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px;
      color: white;
      padding: 0 14px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input::placeholder { color: rgba(255,255,255,0.4); }
    input:focus { border-color: rgba(234,188,31,0.6); }
    input#password { padding-right: 44px; }
    .toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,0.5); display: flex; transition: color 0.2s;
    }
    .toggle:hover { color: rgba(255,255,255,0.9); }
    .toggle svg { height: 1rem; width: 1rem; }

    .submit {
      width: 100%; height: 44px;
      font-weight: 600; font-size: 0.95rem;
      background: linear-gradient(135deg, #EABC1F 0%, #F0CB45 100%);
      color: var(--navy-deep);
      border-radius: 12px; border: none; cursor: pointer;
      transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .submit:hover { filter: brightness(1.05); }
    .submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .spinner { height: 18px; width: 18px; border: 2px solid rgba(29,58,69,0.3); border-top-color: var(--navy-deep);
      border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer { padding: 1rem 2rem; border-top: 1px solid rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      font-size: 0.75rem; color: rgba(255,255,255,0.5); }
    .footer svg { height: 0.875rem; width: 0.875rem; color: #2ecc71; }

    /* Indicador de profundidad */
    .depth { position: fixed; right: 2rem; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
      animation: slide 0.6s ease 0.5s both; }
    @keyframes slide { from { opacity: 0; transform: translate(20px, -50%); } to { opacity: 1; transform: translate(0, -50%); } }
    .depth .line { height: 10rem; width: 1px; background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.2), transparent); }
    .depth .marks { display: flex; flex-direction: column; gap: 0.25rem; }
    .depth .mark { display: flex; align-items: center; gap: 0.5rem; }
    .depth .tick { width: 0.5rem; height: 1px; background: rgba(255,255,255,0.3); }
    .depth .m { font-size: 10px; color: rgba(255,255,255,0.4); font-family: monospace; }
    @media (max-width: 1024px) { .depth { display: none; } }
  </style>
</head>
<body>
  <video class="bg-video" autoplay loop muted playsinline>
    <source src="public/Truck_cruising_down_highway_20260915111218.mp4" type="video/mp4" />
  </video>
  <div class="overlay-1"></div>
  <div class="overlay-2"></div>

  <div class="panel-wrap">
    <div class="panel">
      <div class="header">
        <div class="logo-badge">
          <!-- anchor -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="22" y2="8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/><circle cx="12" cy="5" r="3"/></svg>
        </div>
        <h1 class="brand">Due Diligence</h1>
        <p class="tagline">Legal Intelligence · Sector Transporte</p>
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Correo Electrónico</label>
          <input id="email" type="email" placeholder="correo@empresa.com" value="demo@diligencia.co" required />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <input id="password" type="password" placeholder="••••••••" value="demo1234" required />
            <button type="button" class="toggle" id="toggle" aria-label="Mostrar contraseña">
              <svg id="eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eyeoff" style="display:none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit" id="submit">Ingresar al Portal</button>
      </form>

      <div class="footer">
        <!-- shield-check -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>Conexión segura · TLS 1.3 · AES-256</span>
      </div>
    </div>
  </div>

  <div class="depth">
    <div class="line"></div>
    <div class="marks">
      <div class="mark"><div class="tick"></div><span class="m">0m</span></div>
      <div class="mark"><div class="tick"></div><span class="m">1m</span></div>
      <div class="mark"><div class="tick"></div><span class="m">2m</span></div>
      <div class="mark"><div class="tick"></div><span class="m">3m</span></div>
      <div class="mark"><div class="tick"></div><span class="m">4m</span></div>
      <div class="mark"><div class="tick"></div><span class="m">5m</span></div>
    </div>
    <div class="line"></div>
  </div>

  <script>
    const pwd = document.getElementById('password');
    const eye = document.getElementById('eye');
    const eyeoff = document.getElementById('eyeoff');
    document.getElementById('toggle').addEventListener('click', () => {
      const show = pwd.type === 'password';
      pwd.type = show ? 'text' : 'password';
      eye.style.display = show ? 'none' : 'block';
      eyeoff.style.display = show ? 'block' : 'none';
    });

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span><span>Verificando...</span>';
      // Demo estático: sin backend. Entra a la app rápido.
      setTimeout(() => { window.location.href = 'app.html'; }, 400);
    });
  </script>
</body>
</html>
