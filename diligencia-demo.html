<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Logicompliance</title>
<style>
  :root{
    --navy-deep:#1D3A45; --navy-medium:#254B59; --gold:#EABC1F; --gold-light:#F0CB45;
    --port-red:#e05252; --starboard-green:#2ecc71; --amber:#e2a92b; --amber-dark:#d4871a;
    --muted:#7A7A7A; --fg:#1D3A45;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--fg)}
  .app{min-height:100vh;
    background-color:#f0f4f8;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(234,188,31,.12) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 10%, rgba(37,75,89,.08) 0%, transparent 40%),
      radial-gradient(ellipse at 60% 80%, rgba(234,188,31,.06) 0%, transparent 50%),
      radial-gradient(ellipse at 10% 70%, rgba(37,75,89,.05) 0%, transparent 40%);
  }
  /* Sidebar */
  aside{position:fixed;left:0;top:0;z-index:40;height:100vh;width:264px;display:flex;flex-direction:column;overflow:hidden;
    background:rgba(29,58,69,.9);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
    border-right:1px solid rgba(234,188,31,.15);transition:width .3s cubic-bezier(.25,.1,.25,1)}
  aside.collapsed{width:72px}
  .side-logo{display:flex;height:64px;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid rgba(234,188,31,.15);flex-shrink:0}
  .side-logo .badge{display:flex;height:40px;width:40px;flex-shrink:0;align-items:center;justify-content:center;border-radius:8px;background:transparent}
  .side-logo .badge svg{height:20px;width:20px;color:var(--gold)}
  .side-logo .badge img{width:38px;height:auto;display:block}
  .side-logo .name{font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--gold);white-space:nowrap}
  aside.collapsed .hide-collapsed{display:none}
  .company{border-bottom:1px solid rgba(234,188,31,.15);padding:16px;flex-shrink:0}
  .company .box{border-radius:8px;background:rgba(255,255,255,.08);padding:12px}
  .company .cname{font-size:14px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .company .cnit{font-size:12px;color:rgba(255,255,255,.6);margin-top:2px}
  .company .score-row{margin-top:8px;display:flex;align-items:center;gap:6px}
  .dot{position:relative;display:flex;height:8px;width:8px;flex-shrink:0}
  .dot .ping{position:absolute;inline-size:100%;block-size:100%;border-radius:999px;opacity:.75;background:var(--amber);animation:ping 1.4s cubic-bezier(0,0,.2,1) infinite}
  .dot .core{position:relative;height:8px;width:8px;border-radius:999px;background:var(--amber)}
  @keyframes ping{75%,100%{transform:scale(2.2);opacity:0}}
  .company .score-lbl{font-size:12px;font-weight:500;color:var(--amber)}
  .company .plan{margin-top:8px;display:inline-flex;align-items:center;border-radius:999px;background:rgba(234,188,31,.2);padding:2px 8px;font-size:12px;font-weight:500;color:var(--gold)}
  nav{flex:1;padding:12px;overflow-y:auto}
  .nav-item{position:relative;display:flex;align-items:center;gap:12px;border-radius:8px;padding:10px 12px;font-size:14px;font-weight:500;color:rgba(255,255,255,.7);cursor:pointer;transition:all .2s;margin-bottom:4px;text-decoration:none}
  .nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav-item.active{background:rgba(234,188,31,.15);color:var(--gold)}
  .nav-item.active::before{content:"";position:absolute;left:0;top:50%;height:24px;width:4px;transform:translateY(-50%);border-radius:0 4px 4px 0;background:var(--gold)}
  .nav-item svg{height:16px;width:16px;flex-shrink:0}
  aside.collapsed .nav-item{justify-content:center}
  .side-footer{border-top:1px solid rgba(234,188,31,.15);padding:12px;flex-shrink:0}
  .logout{display:flex;width:100%;align-items:center;gap:12px;border:none;background:none;border-radius:8px;padding:10px 12px;font-size:14px;font-weight:500;color:rgba(255,255,255,.6);cursor:pointer;transition:all .2s}
  .logout:hover{background:rgba(255,255,255,.08);color:#fff}
  .logout svg{height:16px;width:16px;flex-shrink:0}
  .ver{margin-top:8px;padding:0 12px;font-size:12px;color:rgba(255,255,255,.3)}
  aside.collapsed .side-footer .ver{display:none}
  .toggle-btn{position:fixed;top:72px;left:248px;z-index:50;display:flex;height:24px;width:24px;align-items:center;justify-content:center;border-radius:999px;border:1px solid rgba(234,188,31,.3);background:var(--navy-deep);color:var(--gold);cursor:pointer;transform:translateX(-50%);transition:left .3s cubic-bezier(.25,.1,.25,1)}
  .toggle-btn svg{height:12px;width:12px}
  aside.collapsed ~ .toggle-btn{left:56px}
  main{transition:margin-left .3s;padding:24px;margin-left:264px}
  aside.collapsed ~ main{margin-left:72px}
  .wrap{max-width:1180px;margin:0 auto}
  /* Glass */
  .glass{background:rgba(255,255,255,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.8);border-radius:16px;box-shadow:0 4px 20px rgba(37,75,89,.06)}
  .glass-sm{background:rgba(255,255,255,.55);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.7);border-radius:12px}
  .glass-score{background:rgba(255,255,255,.8);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.85);border-radius:20px;box-shadow:0 8px 30px rgba(37,75,89,.08)}
  .glass-stat{background:rgba(255,255,255,.65);backdrop-filter:blur(16px);border:1px solid;border-radius:14px;padding:16px;transition:transform .2s}
  .glass-stat:hover{transform:translateY(-3px)}
  .glass-finding{background:rgba(255,255,255,.68);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.75);border-radius:14px;transition:all .2s}
  .glass-finding:hover{background:rgba(255,255,255,.85)}
  .glass-gold{background:rgba(234,188,31,.08);border:1px solid rgba(234,188,31,.2);border-radius:12px}
  .glass-security{background:rgba(37,75,89,.05);border:1px solid rgba(37,75,89,.1);border-radius:14px}
  .glass-table{background:rgba(255,255,255,.72);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.8);border-radius:16px;overflow:hidden}
  .glass-upload{background:rgba(255,255,255,.5);border:2px dashed rgba(234,188,31,.4);border-radius:16px;transition:all .2s;cursor:pointer}
  .glass-upload:hover{background:rgba(234,188,31,.06);border-color:var(--gold)}
  .glass-btn-primary{background:linear-gradient(135deg,var(--gold) 0%,var(--gold-light) 100%);color:var(--navy-deep);border:none;border-radius:12px;font-weight:600;cursor:pointer;transition:filter .2s}
  .glass-btn-primary:hover{filter:brightness(1.05)}
  .glass-btn-ghost{background:rgba(255,255,255,.6);border:1px solid rgba(37,75,89,.15);border-radius:12px;color:var(--navy-medium);font-weight:600;cursor:pointer;transition:all .2s}
  .glass-btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
  .glass-bubble-ai{background:rgba(255,255,255,.78);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8);border-radius:16px 16px 16px 4px}
  .glass-bubble-user{background:rgba(234,188,31,.12);border:1px solid rgba(234,188,31,.2);border-radius:16px 16px 4px 16px}
  .glass-input{background:rgba(255,255,255,.7);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8);border-radius:14px;transition:border-color .2s}
  .glass-input:focus-within{border-color:rgba(234,188,31,.5)}
  .glass-pill{background:rgba(255,255,255,.65);border:1px solid rgba(234,188,31,.2);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--navy-medium);cursor:pointer;transition:all .2s;white-space:nowrap}
  .glass-pill:hover{background:rgba(234,188,31,.1)}
  .module-card{cursor:pointer;transition:transform .2s,box-shadow .2s}
  .module-card:hover{transform:translateY(-4px);box-shadow:0 12px 34px rgba(37,75,89,.12)}
  h1.page{font-size:24px;font-weight:700}
  .sub{color:var(--muted);margin-top:4px}
  .muted{color:var(--muted)}
  .view{display:none;animation:fade .4s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .badge-pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;padding:12px 16px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid rgba(37,75,89,.1)}
  td{padding:12px 16px;font-size:14px;border-bottom:1px solid rgba(37,75,89,.06);vertical-align:top}
  tr:last-child td{border-bottom:none}
  .chevron{transition:transform .2s}
  .chevron.open{transform:rotate(180deg)}
  .spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .prose p{margin:4px 0;line-height:1.5}
  .prose strong{color:var(--navy-medium);font-weight:600}
  .prose h1,.prose h2,.prose h3{font-size:14px;font-weight:600;margin:8px 0 4px}
  .prose ul,.prose ol{margin:4px 0;padding-left:18px}
  .prose li{margin:2px 0}
  .prose table{margin:8px 0;font-size:13px}
  .prose th,.prose td{padding:4px 8px;border:1px solid rgba(37,75,89,.15)}
  .kv{display:flex;flex-direction:column;gap:2px}
  .kv .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .kv .v{font-size:14px;font-weight:500}
  .diff-col{border-radius:10px;padding:12px;font-size:13px;line-height:1.5}
  .diff-old{background:rgba(224,82,82,.06);border:1px solid rgba(224,82,82,.2)}
  .diff-new{background:rgba(46,204,113,.06);border:1px solid rgba(46,204,113,.25)}
  .tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:6px}
  .modal-back{position:fixed;inset:0;z-index:100;background:rgba(20,35,42,.45);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;animation:fade .2s ease}
  .modal-card{background:rgba(255,255,255,.96);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.9);border-radius:20px;box-shadow:0 24px 60px rgba(20,35,42,.3);max-width:640px;width:100%;padding:24px;animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
  .icon-x{display:flex;height:32px;width:32px;flex-shrink:0;align-items:center;justify-content:center;border:none;background:rgba(37,75,89,.06);border-radius:10px;color:var(--muted);cursor:pointer;transition:all .2s}
  .icon-x:hover{background:rgba(224,82,82,.1);color:var(--port-red)}
  .icon-x svg{height:18px;width:18px}
  .bar-anim{animation:barfill 1.6s ease-in-out infinite}
  @keyframes barfill{0%{width:8%}50%{width:85%}100%{width:8%}}
  .sel{font-size:12px;color:var(--fg);background:rgba(255,255,255,.7);border:1px solid rgba(37,75,89,.2);border-radius:8px;padding:6px 10px;cursor:pointer;font-family:inherit;outline:none}
  .sel:focus{border-color:rgba(234,188,31,.6)}
  .scan{opacity:.85;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  .login-screen{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden;background:linear-gradient(180deg,#6ca7c4 0%,#3b7a94 55%,#1D3A45 100%)}
  .login-screen.hidden{display:none}
  .login-bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  .login-scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(20,35,42,.35),rgba(20,35,42,.55))}
  .login-panel{position:relative;z-index:2}
  .login-panel{width:100%;max-width:420px;background:rgba(255,255,255,.18);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border-radius:28px;border:1px solid rgba(255,255,255,.35);box-shadow:0 8px 32px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.5)}
  .login-head{padding:32px;text-align:center;border-bottom:1px solid rgba(255,255,255,.2)}
  .login-badge{margin:0 auto 16px;height:66px;width:66px;display:flex;align-items:center;justify-content:center;border-radius:20px;background:rgba(20,35,42,.55);border:1px solid rgba(234,188,31,.4)}
  .login-badge svg{height:32px;width:32px;color:#EABC1F}
  .login-badge{overflow:hidden}
  .login-badge img{width:60px;height:auto;display:block}
  .login-brand{font-size:30px;font-weight:700;letter-spacing:-.02em;color:#EABC1F;text-shadow:0 1px 2px rgba(0,0,0,.15)}
  .login-tag{margin-top:8px;font-size:14px;color:rgba(255,255,255,.85)}
  .login-form{padding:32px;display:flex;flex-direction:column;gap:20px}
  .login-form label{font-size:14px;font-weight:500;color:rgba(255,255,255,.9);display:block;margin-bottom:8px}
  .login-form input{width:100%;height:44px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:12px;color:#fff;padding:0 14px;font-size:15px;outline:none}
  .login-form input::placeholder{color:rgba(255,255,255,.4)}
  .login-form input:focus{border-color:rgba(234,188,31,.6)}
  .login-btn{width:100%;height:44px;font-weight:600;font-size:15px;background:linear-gradient(135deg,#EABC1F,#F0CB45);color:#1D3A45;border-radius:12px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .login-foot{padding:16px 32px;border-top:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:rgba(255,255,255,.55)}
  .login-foot svg{height:14px;width:14px;color:#2ecc71}
  .login-spin{height:18px;width:18px;border:2px solid rgba(29,58,69,.3);border-top-color:#1D3A45;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar">
    <div class="side-logo"><div class="badge" id="logoBadge"></div><span class="name hide-collapsed">Logicompliance</span></div>
    <div class="company hide-collapsed">
      <div class="box">
        <p class="cname">Transportes Andinos de Carga S.A.S.</p>
        <p class="cnit">NIT: 901.455.789-2</p>
        <div class="score-row"><span class="dot"><span class="ping" id="sideDotPing"></span><span class="core" id="sideDotCore"></span></span><span class="score-lbl" id="sideScore">Cumplimiento: 2.9/5</span></div>
        <div><span class="plan">Enterprise · Sector Transporte</span></div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="side-footer">
      <button class="logout" id="logoutBtn" onclick="logout()"></button>
      <p class="ver">v1.1 · Datos seguros</p>
    </div>
  </aside>
  <button class="toggle-btn" id="toggleBtn"></button>
  <main><div class="wrap">
    <section class="view active" id="view-dashboard"></section>
    <section class="view" id="view-normativa"></section>
    <section class="view" id="view-contratos"></section>
    <section class="view" id="view-manifiesto"></section>
    <section class="view" id="view-chat"></section>
  </div></main>
</div>
<div id="modalRoot"></div>

// Si el servidor no responde a tiempo o falla, la vista conserva los datos de respaldo y se muestra un aviso discreto.
const API_TIMEOUT=12000;
async function api(path,opts){
 opts=opts||{};const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),opts.timeout||API_TIMEOUT);
 try{
  const r=await fetch(path,{method:opts.method||'GET',headers:opts.body&&!(opts.body instanceof FormData)?{'content-type':'application/json'}:undefined,
   body:opts.body?(opts.body instanceof FormData?opts.body:JSON.stringify(opts.body)):undefined,signal:ctl.signal,credentials:'same-origin'});
  if(r.status===401&&location.protocol.startsWith('http')&&location.pathname!=='/'){location.href='/';throw new Error('Sesión vencida');}
  const ct=r.headers.get('content-type')||'';
  if(!ct.includes('application/json'))throw new Error('Servidor no disponible ('+r.status+')');
  const j=await r.json();if(!r.ok)throw new Error(j.error||('Error '+r.status));return j;
 }finally{clearTimeout(to);}
}
function aviso(msg,tipo){
 let el=document.getElementById('lcToast');
 if(!el){el=document.createElement('div');el.id='lcToast';el.style.cssText='position:fixed;right:18px;bottom:18px;z-index:80;max-width:340px;padding:10px 14px;border-radius:12px;font-size:12.5px;line-height:1.45;box-shadow:0 8px 24px rgba(29,58,69,.18);transition:opacity .3s;background:#fff;border:1px solid rgba(37,75,89,.15);color:#254B59';document.body.appendChild(el);}
 el.style.borderColor=tipo==='ok'?'rgba(46,204,113,.5)':tipo==='error'?'rgba(224,82,82,.45)':'rgba(234,188,31,.55)';
 el.innerHTML=esc(msg);el.style.opacity='1';clearTimeout(el._t);el._t=setTimeout(()=>{el.style.opacity='0'},6000);
}

 const d=Math.floor(s/86400);return d===1?'Ayer':'Hace '+d+' días';
}

const chatResponses={
 "¿La empresa de transporte tiene derecho de retención de la mercancía si no le pagan el flete?":`**Derecho de retención de la empresa de transporte**

Sí. Por regla general, la empresa de transporte tiene un **derecho de retención** sobre la mercancía mientras no se le pague el valor del transporte (flete) y los gastos que la operación haya generado.

- **Fundamento:** Código de Comercio, arts. 1033 y ss. (privilegio y retención de la empresa de transporte).
- **Alcance:** opera como garantía del pago; **no** autoriza a disponer de la mercancía ni a apropiarse de ella.

**Recomendación:** Capacitar al personal operativo sobre el derecho de la empresa de transporte a retener las mercancías en caso de falta de pago del flete, con el fin de prevenir retrasos en el cumplimiento de las obligaciones de pago y evitar eventuales afectaciones en la entrega de las mercancías.`,
 "¿Qué diferencia jurídica hay entre la remesa y el manifiesto de carga?":`**Remesa vs. Manifiesto de carga**

Son documentos distintos y complementarios:

- **Remesa terrestre de carga:** documento expedido por la empresa de transporte y entregado al remitente de la mercancía, en el que constan las especificaciones del artículo 1010 del Código de Comercio (nombre y dirección del destinatario, lugar de la entrega, naturaleza y valor de la mercancía, entre otras).
- **Manifiesto electrónico de carga:** documento expedido por la empresa de transporte y entregado al propietario, poseedor o tenedor del vehículo, que presta **mérito ejecutivo**, en el que consta el valor a pagar, la información del vehículo de carga y el nombre del conductor, entre otros elementos.

> **Fundamento:** Decreto 1079 de 2015 — transporte terrestre automotor de carga.`,
 "Si el manifiesto registra ICA en $0, ¿qué contingencia me genera?":`**Manifiesto con ICA en $0 — contingencia**

Registrar la retención de ICA en cero cuando el servicio está gravado genera:

1. **Contingencia tributaria:** menor retención frente a la exigida por el municipio, con riesgo de mayor valor a pagar, intereses y sanción.
2. **Hallazgo de cumplimiento:** el manifiesto queda mal diligenciado — siempre debe existir un valor de ICA superior a cero.
3. **Riesgo operativo** ante auditorías o supervisión.

**Recomendación:** liquidar el ICA según la tarifa del municipio correspondiente y corregir el manifiesto.

> **Nota:** conviene validar esta contingencia con un especialista tributario, pues el tratamiento aplicable puede variar según la normativa vigente.`,
 "¿Puedo trasladar por contrato el costo del descargue a la empresa de transporte?":`**¿Se puede trasladar el costo del descargue a la empresa de transporte?**

No como regla. El costo de las labores de **cargue y descargue** corresponde al **remitente y/o destinatario** de la mercancía. Aunque la ejecución material pueda hacerla otro actor de la cadena, el costo final lo asumen el remitente y/o destinatario.

- **Fundamento:** Decreto 1079 de 2015, art. 2.2.1.7.6.9.
- Una cláusula que traslade ese costo a la empresa de transporte contraría la regla y es una **oportunidad de mejora / riesgo** en la revisión del contrato y del manifiesto.

> En el manifiesto analizado, "descargue pagado por" está sin diligenciar: debe indicar remitente o destinatario.`,
 "Con el Decreto 1017 de 2025, ¿qué cambió en los tiempos de cargue y descargue?":`**Decreto 1017 de 2025 — cargue y descargue**

El Decreto 1017 de 2025 (que modifica el Capítulo 7 del Decreto 1079 de 2015) endureció las reglas:

- **Límite de 8 horas** para las operaciones de cargue y descargue, contadas desde la cita programada.
- Si se excede ese plazo, hay **penalidad**: **3 SMLDV** por hora adicional en vehículos **articulados** y **2 SMLDV** en **rígidos**.
- Reafirma que el flete **no puede ser inferior** a los costos eficientes del **SICE-TAC**.

**Recomendación:** ajuste sus contratos y su control de tiempos para registrar horas de llegada/salida y soportar eventuales penalidades.

> Conecta directamente con el campo faltante del manifiesto: *tiempos de cargue y descargue*.`,
 "¿Qué sanciones arriesga la empresa de transporte por operar con un manifiesto mal diligenciado?":`**Riesgos por un manifiesto mal diligenciado**

Estos riesgos recaen sobre la **empresa de transporte**, no sobre el generador de carga (a quien va dirigido este *due diligence*). Un manifiesto con errores u omisiones lo expone a varios frentes:

1. **Supervisión de la Superintendencia de Transporte:** hallazgos, requerimientos y sanciones por incumplimiento de la reglamentación del RNDC y del SICE-TAC.
2. **Contingencia tributaria:** una retención de ICA en $0 o una liquidación incorrecta puede derivar en mayor valor a pagar, intereses y sanción.
3. **Riesgo probatorio:** el manifiesto se genera con **mérito ejecutivo**; datos errados debilitan su valor como título y la posición de la empresa de transporte ante reclamaciones.
4. **Operativo:** pagos por debajo del SICE-TAC o campos incompletos pueden impedir la expedición o el registro en el RNDC.

**Recomendación:** corregir los hallazgos del módulo de manifiesto (ICA, tiempos de cargue/descargue, responsable del descargue) antes del despacho.`,

function updateSideScore(){const ps=panelScore();const el=document.getElementById('sideScore');if(el)el.textContent='Cumplimiento: '+ps.toFixed(1)+'/5';
 const c=scoreColor(ps);['sideDotPing','sideDotCore'].forEach(id=>{const d=document.getElementById(id);if(d)d.style.background=c;});
 const l=document.querySelector('.score-lbl');if(l)l.style.color=c;}
function arcPt(p,r){return [100-r*Math.cos(Math.PI*p),100-r*Math.sin(Math.PI*p)];}
function gaugeSeg(p0,p1,color){const[a,b]=arcPt(p0,80);const[c,d]=arcPt(p1,80);return `<path d="M ${a.toFixed(2)} ${b.toFixed(2)} A 80 80 0 0 1 ${c.toFixed(2)} ${d.toFixed(2)}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" opacity=".9"/>`;}
function gaugeSVG(score){
 const angle=(score/5)*180-90;
 let ticks='';
 for(let m=0;m<=5;m++){const t=m/5;const[a,b]=arcPt(t,74);const[c,d]=arcPt(t,86);const[lx,ly]=arcPt(t,95);
  ticks+=`<line x1="${a.toFixed(1)}" y1="${b.toFixed(1)}" x2="${c.toFixed(1)}" y2="${d.toFixed(1)}" stroke="#c3ccd6" stroke-width="1.5"/>
  <text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="middle" fill="#8a97a3" font-size="8.5" font-family="ui-monospace,monospace">${m}</text>`;}
 return `<svg viewBox="0 0 200 108" style="width:224px;max-width:100%">
  ${ticks}
  ${gaugeSeg(0,0.4,'#e05252')}
  ${gaugeSeg(0.4,0.7,'#e8933a')}
  ${gaugeSeg(0.7,1,'#2ecc71')}
  <g style="transform-origin:100px 100px;transform:rotate(${angle}deg);transition:transform 1s cubic-bezier(.2,.8,.2,1)"><polygon points="100,30 97,100 103,100" fill="#1D3A45"/></g>
  <circle cx="100" cy="100" r="8.5" fill="#1D3A45"/><circle cx="100" cy="100" r="3.5" fill="#fff"/>
 </svg>`;
}
function gaugeBlock(score){
 return `<div style="display:flex;flex-direction:column;align-items:center">${gaugeSVG(score)}
  <div style="margin-top:2px;display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums">
   <span style="font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1;color:${scoreColor(score)}">${score.toFixed(1)}</span>
   <span style="font-size:15px;color:var(--muted);font-weight:600">/ 5.0</span></div></div>`;
}

 if(!PANEL.actividad.length)return [{ic:'bell',col:'#8a97a3',t:'Sin actividad registrada',s:'Los análisis que realice aparecerán aquí.',time:''}];
 return PANEL.actividad.map(e=>{const st=ACT_STYLE[e.tipo]||['bell','#254B59'];return {ic:st[0],col:st[1],t:esc(e.titulo),s:esc(e.detalle||''),time:hace(e.created_at)};});
}
function modulosVista(){
 if(!PANEL)return modules;
 const m=modules.map(x=>({...x}));
 m[0].tag=PANEL.kpis.normasNuevasSemana+' novedades';
 if(PANEL.contrato)m[1].tag='Riesgo '+Number(PANEL.contrato.score).toFixed(1)+'/5';
 if(PANEL.manifiesto)m[2].tag=PANEL.manifiesto.hallazgos+' hallazgos';
 return m;
}

let boletinOpen=false, boletinLoading=false, analisisLoading=false, analisisDone=false, nuevasIds=[];

function estadoBadge(e){
 const map={nueva:['Nueva','#2ecc71','rgba(46,204,113,.12)'],proyecto:['Proyecto','#d4871a','rgba(212,135,26,.12)'],actualizada:['Actualizada','#EABC1F','rgba(234,188,31,.14)'],reciente:['Recién detectada','#2ecc71','rgba(46,204,113,.16)'],vigente:['Vigente','#254B59','rgba(37,75,89,.1)']};
 const[l,c,b]=map[e];return `<span class="badge-pill" style="background:${b};color:${c}">${l}</span>`;
}
function startAnalisis(){
 if(analisisLoading||analisisDone)return;
 analisisLoading=true;renderNormativa();
 setTimeout(()=>{
  analisisLoading=false;analisisDone=true;
  nuevasIds=normasNuevas.map(n=>n.id);
  listaNormas=[...normasNuevas,...listaNormas];
  renderNormativa();
 },1700);
}
function startBoletin(){
 if(boletinLoading)return;
 if(boletinOpen){boletinOpen=false;renderNormativa();return;}
 boletinLoading=true;renderNormativa();
 setTimeout(()=>{boletinLoading=false;boletinOpen=true;renderNormativa();
  const el=document.getElementById('boletinBox');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},1500);
}

function mdToHtml(md){
 const lines=md.split('\n');let html='',inUl=false,inOl=false,tbl=[];
 const flush=()=>{if(inUl){html+='</ul>';inUl=false}if(inOl){html+='</ol>';inOl=false}
  if(tbl.length){const rows=tbl.filter(r=>!/^\s*\|[-\s|]+\|\s*$/.test(r));
   html+='<table>'+rows.map((r,i)=>{const cells=r.split('|').slice(1,-1).map(c=>c.trim());
    return '<tr>'+cells.map(c=>i===0?`<th>${c}</th>`:`<td>${c}</td>`).join('')+'</tr>'}).join('')+'</table>';tbl=[]}};
 const inl=t=>t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
 lines.forEach(l=>{
  if(/^\s*\|.*\|\s*$/.test(l)){if(inUl||inOl)flush();tbl.push(l);return}else if(tbl.length)flush();
  if(/^&gt;\s|^>\s/.test(l)){flush();html+=`<p style="border-left:3px solid #EABC1F;padding-left:10px;color:#254B59">${inl(l.replace(/^(&gt;|>)\s/,''))}</p>`}
  else if(/^#{1,3}\s/.test(l)){flush();html+=`<h3>${inl(l.replace(/^#+\s/,''))}</h3>`}
  else if(/^\s*-\s/.test(l)){if(!inUl){flush();html+='<ul>';inUl=true}html+=`<li>${inl(l.replace(/^\s*-\s/,''))}</li>`}
  else if(/^\s*\d+\.\s/.test(l)){if(!inOl){flush();html+='<ol>';inOl=true}html+=`<li>${inl(l.replace(/^\s*\d+\.\s/,''))}</li>`}
  else if(l.trim()===''){flush()}
  else{flush();html+=`<p>${inl(l)}</p>`}
 });flush();return html;
}

      ${m.role==='assistant'?`<div style="display:flex;height:32px;width:32px;flex-shrink:0;align-items:center;justify-content:center;border-radius:12px;background:rgba(234,188,31,.12);border:1px solid rgba(234,188,31,.2);color:#EABC1F;margin-top:4px">${I.bot}</div>`:''}
      <div class="${m.role==='assistant'?'glass-bubble-ai':'glass-bubble-user'}" style="max-width:78%;padding:12px 16px;font-size:14px">
       ${m.role==='assistant'?`<div class="prose">${mdToHtml(m.content)}</div>`:`<p>${m.content}</p>`}
       <p style="margin-top:8px;font-size:10px;color:rgba(122,122,122,.6)">${now}</p></div>
      ${m.role==='user'?`<div class="glass-sm" style="display:flex;height:32px;width:32px;flex-shrink:0;align-items:center;justify-content:center;border-radius:12px;color:var(--navy-medium);margin-top:4px">${I.user}</div>`:''}
     </div>`).join('')}
    ${chatLoading?`<div style="display:flex;gap:12px"><div style="display:flex;height:32px;width:32px;flex-shrink:0;align-items:center;justify-content:center;border-radius:12px;background:rgba(234,188,31,.12);border:1px solid rgba(234,188,31,.2);color:#EABC1F;margin-top:4px">${I.bot}</div><div class="glass-bubble-ai" style="padding:12px 16px"><div style="display:flex;gap:6px">${[0,150,300].map(d=>`<span style="height:8px;width:8px;border-radius:999px;background:rgba(234,188,31,.6);animation:bounce .6s infinite;animation-delay:${d}ms"></span>`).join('')}</div></div></div>`:''}
   </div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;flex-shrink:0">
    ${quickActions.map(a=>`<button class="glass-pill" onclick="sendChat(${JSON.stringify(a).replace(/"/g,'&quot;')})">${a}</button>`).join('')}
   </div>
   <div class="glass-input" style="display:flex;gap:12px;padding:8px;flex-shrink:0">
    <input id="chatInput" placeholder="Escriba su consulta legal..." style="flex:1;background:transparent;border:none;outline:none;font-size:14px;color:var(--fg);padding:0 8px" onkeydown="if(event.key==='Enter'){event.preventDefault();sendChat(this.value)}">
    <button class="glass-btn-primary" style="height:36px;width:36px;display:flex;align-items:center;justify-content:center;border-radius:12px" onclick="sendChat(document.getElementById('chatInput').value)">${I.send}</button>
   </div>
  </div>`;
 const c=document.getElementById('chatMsgs');if(c)c.scrollTop=c.scrollHeight;
}
function sendChat(text){
 if(!text||!text.trim()||chatLoading)return;
 chatMsgs.push({role:'user',content:text.trim()});chatLoading=true;renderChat();
 setTimeout(()=>{
  const reply=chatResponses[text.trim()]||`Gracias por su consulta. En esta **demo** están precargadas las respuestas de los botones de acción rápida.\n\nEn la versión real, esta pregunta se procesa con un **RAG jurídico** (normativa vigente indexada) y un modelo de lenguaje, devolviendo la respuesta con las **fuentes** que la sustentan.`;
  chatMsgs.push({role:'assistant',content:reply});chatLoading=false;renderChat();
 },800);
}

const st=document.createElement('style');st.textContent='@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}';document.head.appendChild(st);

/* init */
initStatic();
renderDashboard();renderNormativa();renderContratos();renderManifiesto();renderChat();updateSideScore();
go('dashboard');
cargarPanel();cargarNormas();

/* logout real: borra la cookie de sesión en el servidor */
function logout(){fetch('/api/acceso',{method:'DELETE'}).catch(function(){}).finally(function(){location.href='/';});}
window.showLogin=logout;
</script>

 .grid-main{grid-template-columns:1fr!important}
 .grid-mods{grid-template-columns:1fr!important}
 .grid-manif{grid-template-columns:1fr!important}
 .grid-diff{grid-template-columns:1fr!important}
}
